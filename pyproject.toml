[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creative-mcp"
version = "0.2.0"
description = "Portable local deployment of Codex, GIMP and Blender tooling"
requires-python = ">=3.11"
dependencies = ["mcp==1.26.0"]

[project.scripts]
creative-mcp = "creative_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
